<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Episode Labeler</title>
<style>
  :root {
    --bg: #f6f7f9; --panel: #ffffff; --text: #1d2330; --muted: #6b7280; --line: #d9dde3;
    --accent: #2563eb; --cursor: #dc2626; --hil: rgba(245, 158, 11, 0.28); --progress: #111827;
    --s0: #93c5fd; --s1: #86efac; --s2: #fcd34d; --s3: #c4b5fd; --s4: #f9a8d4;
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--text); font: 14px/1.45 system-ui, "Malgun Gothic", sans-serif; }
  header { display: flex; flex-wrap: wrap; gap: 10px; align-items: center; padding: 10px 16px; background: var(--panel); border-bottom: 1px solid var(--line); }
  header h1 { font-size: 16px; margin: 0 8px 0 0; }
  select, button, textarea { font: inherit; }
  button { border: 1px solid var(--line); background: var(--panel); border-radius: 6px; padding: 4px 10px; cursor: pointer; }
  button.on { background: var(--accent); color: #fff; border-color: var(--accent); }
  main { padding: 12px 16px; max-width: 1400px; margin: 0 auto; }
  .videos { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
  .videos figure { margin: 0; background: #000; border-radius: 6px; overflow: hidden; position: relative; }
  .videos video { width: 100%; display: block; }
  .videos figcaption { position: absolute; left: 8px; top: 6px; color: #fff; font-size: 12px; background: rgba(0,0,0,.45); padding: 1px 6px; border-radius: 4px; }
  .status { display: flex; flex-wrap: wrap; gap: 16px; margin: 8px 0; font-variant-numeric: tabular-nums; }
  .status b { font-weight: 600; }
  canvas { width: 100%; height: 170px; background: var(--panel); border: 1px solid var(--line); border-radius: 6px; cursor: crosshair; display: block; }
  .row { display: grid; grid-template-columns: 1.2fr 1fr; gap: 12px; margin-top: 10px; }
  .card { background: var(--panel); border: 1px solid var(--line); border-radius: 6px; padding: 10px 12px; }
  .card h2 { font-size: 14px; margin: 0 0 6px; }
  .events li { margin: 2px 0; }
  .events li span { display: inline-block; min-width: 72px; font-variant-numeric: tabular-nums; }
  .events button { padding: 0 6px; margin-left: 6px; }
  .keys { color: var(--muted); columns: 2; font-size: 13px; }
  .keys kbd { background: #eef0f3; border: 1px solid var(--line); border-radius: 4px; padding: 0 4px; font: 12px ui-monospace, monospace; color: var(--text); }
  textarea { width: 100%; height: 54px; border: 1px solid var(--line); border-radius: 6px; padding: 6px; resize: vertical; }
  .saved { color: var(--muted); font-size: 12px; }
  .warn { color: #b45309; }
  @media (max-width: 800px) { .videos, .row { grid-template-columns: 1fr; } .keys { columns: 1; } }
</style>
</head>
<body>
<header>
  <h1>Episode Labeler</h1>
  <button id="prev">◀ 이전 (P)</button>
  <select id="epSel"></select>
  <button id="next">다음 (N) ▶</button>
  <span id="summary" class="saved"></span>
  <span class="saved">과제: <code id="task"></code></span>
  <span style="flex:1"></span>
  <span>재생 속도</span>
  <select id="rate"><option>0.5</option><option selected>1</option><option>2</option></select>
  <span id="saveState" class="saved"></span>
</header>
<main>
  <div class="videos">
    <figure><video id="v1" muted playsinline preload="auto"></video><figcaption id="c1"></figcaption></figure>
    <figure><video id="v2" muted playsinline preload="auto"></video><figcaption id="c2"></figcaption></figure>
  </div>
  <div class="status">
    <span>프레임 <b id="frame">0</b> / <span id="len">0</span></span>
    <span>시간 <b id="time">0.00</b>s</span>
    <span>단계 <b id="stage">-</b> <span id="instr" class="saved"></span></span>
    <span>진행도 <b id="prog">-</b></span>
    <span id="hilInfo" class="warn"></span>
  </div>
  <canvas id="tl"></canvas>
  <div class="row">
    <div class="card">
      <h2>결과</h2>
      <div id="outcomes"></div>
      <h2 style="margin-top:10px">사건 표시</h2>
      <ul class="events" id="eventList"></ul>
      <textarea id="note" placeholder="메모 (예: 첫 접근은 비닐을 못 건드리고 되돌아옴)"></textarea>
    </div>
    <div class="card">
      <h2>키</h2>
      <div class="keys" id="keys"></div>
    </div>
  </div>
</main>
<script>
const $ = (id) => document.getElementById(id);
const v1 = $("v1"), v2 = $("v2"), tl = $("tl");
let meta, ep, label, epPos = 0, playing = false;
const stageColors = ["--s0", "--s1", "--s2", "--s3", "--s4"].map((v) => getComputedStyle(document.documentElement).getPropertyValue(v).trim());

function eventIndex(type) { return meta.events.findIndex((e) => e.key === type); }

// Stage proportions the way SARM sets them: average share of each stage's time over the
// episodes labeled as success (repeated stages are summed). Equal shares until labels exist.
function proportions() {
  const n = meta.stages.length, sums = new Array(n).fill(0);
  let count = 0;
  for (const l of Object.values(meta.labels)) {
    if (l.outcome !== "success" || !l.events || l.events.length < 2) continue;
    const dur = new Array(n).fill(0);
    for (let i = 0; i + 1 < l.events.length; i++) {
      const k = Math.min(eventIndex(l.events[i].type), n - 1);
      dur[k] += l.events[i + 1].frame - l.events[i].frame;
    }
    const total = dur.reduce((a, b) => a + b, 0);
    if (total <= 0) continue;
    dur.forEach((d, k) => (sums[k] += d / total));
    count++;
  }
  const props = count ? sums.map((s) => s / count) : new Array(n).fill(1 / n);
  const total = props.reduce((a, b) => a + b, 0) || 1;
  return props.map((p) => p / total);
}

function stageAt(f) {
  const ev = label.events;
  if (!ev.length || f < ev[0].frame) return -1;
  for (let i = 0; i + 1 < ev.length; i++) if (f < ev[i + 1].frame) return Math.min(eventIndex(ev[i].type), meta.stages.length - 1);
  return meta.stages.length; // after the last event: done
}

function progressAt(f, props) {
  const ev = label.events;
  if (ev.length < 2) return null;
  if (f < ev[0].frame) return 0;
  const cum = props.map((_, k) => props.slice(0, k).reduce((a, b) => a + b, 0));
  for (let i = 0; i + 1 < ev.length; i++) {
    const a = ev[i].frame, b = ev[i + 1].frame;
    if (f < b) {
      const k = Math.min(eventIndex(ev[i].type), props.length - 1);
      return cum[k] + props[k] * (b > a ? (f - a) / (b - a) : 1);
    }
  }
  return 1;
}

function curFrame() {
  const from = ep.videos[meta.cameras[0]].from;
  return Math.max(0, Math.min(ep.length - 1, Math.floor((v1.currentTime - from) * meta.fps + 1e-3)));
}

function seek(frame) {
  frame = Math.max(0, Math.min(ep.length - 1, frame));
  const vids = [v1, v2];
  meta.cameras.slice(0, 2).forEach((cam, i) => (vids[i].currentTime = ep.videos[cam].from + (frame + 0.5) / meta.fps));
  draw();
}

function setPlaying(on) {
  playing = on;
  if (on) { if (curFrame() >= ep.length - 1) seek(0); v1.play(); v2.play(); }
  else { v1.pause(); v2.pause(); seek(curFrame()); }
}

function tick() {
  if (playing && ep) {
    const f = curFrame(), end = ep.videos[meta.cameras[0]].to;
    if (v1.currentTime >= end - 0.5 / meta.fps) { setPlaying(false); seek(ep.length - 1); }
    const cam2 = meta.cameras[1];
    if (cam2) {
      const want = ep.videos[cam2].from + (v1.currentTime - ep.videos[meta.cameras[0]].from);
      if (Math.abs(v2.currentTime - want) > 0.08) v2.currentTime = want;
    }
    draw(f);
  }
  requestAnimationFrame(tick);
}

function draw(f = curFrame()) {
  const dpr = window.devicePixelRatio || 1, W = tl.clientWidth, H = tl.clientHeight;
  tl.width = W * dpr; tl.height = H * dpr;
  const g = tl.getContext("2d"); g.scale(dpr, dpr);
  const pad = 10, x = (fr) => pad + (fr / Math.max(ep.length - 1, 1)) * (W - 2 * pad);
  const bandY = H - 34, bandH = 14, plotTop = 18, plotBot = bandY - 8;
  g.clearRect(0, 0, W, H);
  // human-driven frames from the intervention recorder
  const hil = meta.hil[String(ep.index)];
  if (hil) { g.fillStyle = getComputedStyle(document.documentElement).getPropertyValue("--hil"); for (const [a, b] of hil.interventions) g.fillRect(x(a), plotTop, x(b) - x(a), bandY + bandH - plotTop); }
  // stage bands
  const ev = label.events;
  for (let i = 0; i + 1 < ev.length; i++) {
    g.fillStyle = stageColors[Math.min(eventIndex(ev[i].type), meta.stages.length - 1) % stageColors.length];
    g.fillRect(x(ev[i].frame), bandY, x(ev[i + 1].frame) - x(ev[i].frame), bandH);
  }
  g.strokeStyle = "#d9dde3"; g.strokeRect(pad, bandY, W - 2 * pad, bandH);
  // progress curve
  const props = proportions();
  if (ev.length >= 2) {
    g.strokeStyle = getComputedStyle(document.documentElement).getPropertyValue("--progress"); g.lineWidth = 1.5; g.beginPath();
    for (let px = 0; px <= W - 2 * pad; px += 2) {
      const fr = Math.round((px / (W - 2 * pad)) * (ep.length - 1)), p = progressAt(fr, props);
      const y = plotBot - p * (plotBot - plotTop);
      px ? g.lineTo(pad + px, y) : g.moveTo(pad + px, y);
    }
    g.stroke();
  }
  // event markers
  g.font = "12px system-ui, Malgun Gothic"; g.textAlign = "center";
  for (const e of ev) {
    g.strokeStyle = "#374151"; g.lineWidth = 1; g.beginPath(); g.moveTo(x(e.frame), plotTop); g.lineTo(x(e.frame), bandY + bandH); g.stroke();
    g.fillStyle = "#374151"; g.fillText(meta.events[eventIndex(e.type)].name, x(e.frame), 13);
  }
  // cursor
  g.strokeStyle = getComputedStyle(document.documentElement).getPropertyValue("--cursor"); g.lineWidth = 2;
  g.beginPath(); g.moveTo(x(f), 0); g.lineTo(x(f), H); g.stroke();
  g.fillStyle = "#6b7280"; g.textAlign = "left"; g.fillText("1.0", 2, plotTop + 4); g.fillText("0", 2, plotBot);
  // status
  $("frame").textContent = f; $("time").textContent = (f / meta.fps).toFixed(2);
  const s = stageAt(f);
  $("stage").textContent = s < 0 ? "시작 전" : s >= meta.stages.length ? "끝" : meta.stages[s].name;
  $("instr").textContent = s >= 0 && s < meta.stages.length ? meta.stages[s].instruction : "";
  const p = progressAt(f, props); $("prog").textContent = p === null ? "-" : p.toFixed(2);
}

function renderSide() {
  $("outcomes").innerHTML = "";
  for (const [key, name] of Object.entries(meta.outcomes)) {
    const b = document.createElement("button");
    b.textContent = `${name} (${{ success: "S", misaligned: "A", failure: "F", exclude: "X" }[key]})`;
    if (label.outcome === key) b.className = "on";
    b.onclick = () => setOutcome(key); $("outcomes").appendChild(b); $("outcomes").append(" ");
  }
  const ul = $("eventList"); ul.innerHTML = "";
  label.events.forEach((e, i) => {
    const li = document.createElement("li");
    li.innerHTML = `<span>${e.frame} (${(e.frame / meta.fps).toFixed(1)}s)</span>${meta.events[eventIndex(e.type)].name}`;
    const go = document.createElement("button"); go.textContent = "이동"; go.onclick = () => seek(e.frame);
    const del = document.createElement("button"); del.textContent = "삭제"; del.onclick = () => { label.events.splice(i, 1); changed(); };
    li.append(go, del); ul.appendChild(li);
  });
  if (!label.events.length) ul.innerHTML = `<li class='saved'>아직 없음. 해당 프레임에서 1~${meta.events.length}를 누르세요.</li>`;
  const hil = meta.hil[String(ep.index)];
  $("hilInfo").textContent = hil ? `개입 녹화: ${hil.success ? "성공" : "실패"}로 저장됨, 사람 조종 구간 ${hil.interventions.length}개(주황색)` : "";
  renderEpisodeList();
}

function renderEpisodeList() {
  const sel = $("epSel"); const cur = epPos; sel.innerHTML = "";
  let done = 0;
  meta.episodes.forEach((e, i) => {
    const l = meta.labels[String(e.index)], o = document.createElement("option");
    if (l && l.outcome) done++;
    o.value = i; o.textContent = `ep ${e.index}` + (l && l.outcome ? ` · ${meta.outcomes[l.outcome]} · 사건 ${l.events.length}` : "");
    sel.appendChild(o);
  });
  sel.value = cur; $("summary").textContent = `결과 표시 ${done}/${meta.episodes.length}`;
}

const saveTimers = {};
function changed() {
  label.events.sort((a, b) => a.frame - b.frame);
  // Snapshot now: the save must go to this episode even if the user moves on before it fires.
  const index = ep.index, body = JSON.stringify(label);
  meta.labels[String(index)] = JSON.parse(body);
  renderSide(); draw();
  $("saveState").textContent = "저장 중...";
  clearTimeout(saveTimers[index]);
  saveTimers[index] = setTimeout(async () => {
    const r = await fetch(`/api/label/${index}`, { method: "POST", headers: { "Content-Type": "application/json" }, body });
    $("saveState").textContent = r.ok ? "저장됨" : "저장 실패!";
  }, 250);
}

function setOutcome(key) { label.outcome = key; changed(); }

function addEvent(k) {
  const f = curFrame(), type = meta.events[k].key;
  label.events = label.events.filter((e) => !(e.type === type && Math.abs(e.frame - f) <= 3));
  label.events.push({ type, frame: f }); changed();
}

function removeNearest() {
  const f = curFrame(); let best = -1, dist = 16;
  label.events.forEach((e, i) => { const d = Math.abs(e.frame - f); if (d < dist) { dist = d; best = i; } });
  if (best >= 0) { label.events.splice(best, 1); changed(); }
}

function loadEpisode(pos) {
  playing = false; v1.pause(); v2.pause();
  epPos = Math.max(0, Math.min(meta.episodes.length - 1, pos)); ep = meta.episodes[epPos];
  const saved = meta.labels[String(ep.index)];
  label = saved ? JSON.parse(JSON.stringify(saved)) : { events: [], outcome: null, note: "" };
  $("note").value = label.note || "";
  $("len").textContent = ep.length;
  const vids = [v1, v2];
  meta.cameras.slice(0, 2).forEach((cam, i) => {
    const url = ep.videos[cam].url;
    if (!vids[i].src.endsWith(url)) vids[i].src = url;
    $("c" + (i + 1)).textContent = cam.replace("observation.images.", "");
  });
  v1.playbackRate = v2.playbackRate = Number($("rate").value);
  const ready = () => seek(0);
  if (v1.readyState >= 1) ready(); else v1.addEventListener("loadedmetadata", ready, { once: true });
  renderSide();
}

document.addEventListener("keydown", (e) => {
  if (e.target === $("note") || e.target.tagName === "SELECT") return;
  const k = e.key.toLowerCase();
  if (e.key === " ") { e.preventDefault(); setPlaying(!playing); }
  else if (e.key === "ArrowLeft" || e.key === "ArrowRight") {
    e.preventDefault(); if (playing) setPlaying(false);
    seek(curFrame() + (e.key === "ArrowRight" ? 1 : -1) * (e.shiftKey ? 10 : 1));
  }
  else if (e.key === "Home") seek(0);
  else if (e.key === "End") seek(ep.length - 1);
  else if (/^[1-9]$/.test(e.key) && Number(e.key) <= meta.events.length) addEvent(Number(e.key) - 1);
  else if (e.key === "Delete" || e.key === "Backspace") { e.preventDefault(); removeNearest(); }
  else if (k === "s") setOutcome("success");
  else if (k === "a") setOutcome("misaligned");
  else if (k === "f") setOutcome("failure");
  else if (k === "x") setOutcome("exclude");
  else if (k === "n" || e.key === "PageDown") loadEpisode(epPos + 1);
  else if (k === "p" || e.key === "PageUp") loadEpisode(epPos - 1);
});

let dragging = false;
function seekFromMouse(ev) {
  const r = tl.getBoundingClientRect(), pad = 10;
  if (playing) setPlaying(false);
  seek(Math.round(((ev.clientX - r.left - pad) / (r.width - 2 * pad)) * (ep.length - 1)));
}
tl.addEventListener("mousedown", (ev) => { dragging = true; seekFromMouse(ev); });
window.addEventListener("mousemove", (ev) => dragging && seekFromMouse(ev));
window.addEventListener("mouseup", () => (dragging = false));
v1.addEventListener("seeked", () => !playing && draw());
$("note").addEventListener("input", () => { label.note = $("note").value; changed(); });
$("prev").onclick = () => loadEpisode(epPos - 1);
$("next").onclick = () => loadEpisode(epPos + 1);
$("epSel").onchange = () => loadEpisode(Number($("epSel").value));
$("rate").onchange = () => (v1.playbackRate = v2.playbackRate = Number($("rate").value));
window.addEventListener("resize", () => draw());

(async () => {
  meta = await (await fetch("/api/meta")).json();
  const ev = meta.events.map((e, i) => `<div><kbd>${i + 1}</kbd> ${e.name}: ${e.desc}</div>`).join("");
  const st = meta.stages.map((s) => `<div>${s.name}: <code>${s.instruction}</code></div>`).join("");
  $("task").textContent = meta.task;
  $("keys").innerHTML = ev + `<div style="margin-top:6px"><b>단계와 지시문</b></div>` + st + `
    <div><kbd>Space</kbd> 재생/정지</div>
    <div><kbd>←</kbd><kbd>→</kbd> 1프레임, <kbd>Shift</kbd>+화살표 10프레임</div>
    <div><kbd>Delete</kbd> 가까운 표시 지우기</div>
    <div><kbd>S</kbd> 성공 <kbd>A</kbd> 정렬 불량 <kbd>F</kbd> 실패 <kbd>X</kbd> 제외</div>
    <div><kbd>N</kbd>/<kbd>P</kbd> 다음/이전 에피소드</div>
    <div>타임라인을 클릭하거나 끌면 이동</div>
    <div>같은 사건을 두 번 표시해도 됩니다 (미끄러져 다시 집기 등)</div>`;
  loadEpisode(0);
  requestAnimationFrame(tick);
})();
</script>
</body>
</html>
